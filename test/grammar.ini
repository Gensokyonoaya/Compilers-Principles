#修改为LL(1)文法
#已将所有EBNF都转换为BNF、消除左递归、提取左公因子消除FIRST集冲突
#标记TODO的部分文法需要手动识别
#1.	Program -> compUnit; 
#一个程序（program）是一个或多个编译单元（compUnit）
1.	Program -> compUnit;

#2.	compUnit -> (decl | funcDef)* EOF; 
#EOF设置在这里是何意味？在计算FOLLOW集时手动以'EOF'作为结束符
#编译单元可以是声明decl（变量/常量/结构体等）或函数定义funcDef，递归定义表示可以有多个
	compUnit -> compUnitItem compUnit | $;
	compUnitItem -> decl | funcDef;

3.	decl -> constDecl | varDecl;
#decl声明可以是常量声明constDecl或变量声明varDecl

#4.	constDecl -> 'const' bType constDef (',' constDef)* ';';
#constDecl：声明一个常量，类型是 bType（如 int、char），可以定义多个常量
	constDecl -> 'const' bType constDef constDefList ';';
	constDefList -> ',' constDef constDefList | $;

5.	bType -> 'int' | 'float';

6.	constDef -> Ident '=' constInitVal;
#constDef：常量定义，Ident是标识符（常量名），constInitVal是常量初值

7.	constInitVal -> constExp;
#constExp：即常量表达式

#8.	varDecl -> bType varDef (',' varDef)* ';';
#varDecl：声明一个变量，类型是 bType（如 int、char），可以定义多个变量，用逗号分隔
	varDecl -> bType varDef varDefList ';';
	varDefList -> ',' varDef varDefList | $;

#9.	varDef -> Ident | Ident '=' initVal;
#varDef：变量定义，Ident是标识符（变量名），initVal是变量值
#verDefSuffix表示是否赋初值
	varDef -> Ident verDefSuffix;
#TODO：c标准中main被识别为一个标识符，而本次实验中要求把main当作一个关键字，因此只能在语法分析过程中手动去识别main函数
	verDefSuffix -> '=' initVal | $;

10.	initVal -> exp;
#initVal：变量初值exp是表达式

#11.	funcDef -> funcType Ident '(' (funcFParams)? ')' block;
#函数定义funcDef：函数类型funcType（如 void）、函数名Ident、参数列表funcFParams和函数体block
	funcDef -> funcType Ident '(' funcFParamsOpt ')' block;
	funcFParamsOpt -> funcFParams | $;

#12.	funcType -> 'void' | 'int';
#TODO：c标准中main被识别为一个标识符，而本次实验中要求把main当作一个关键字，因此只能在语法分析过程中手动去识别main函数
	funcType -> 'void';

#13.	funcFParams -> funcFParam (',' funcFParam)*;
#参数列表funcFParams
	funcFParams -> funcFParam funcFParamsList;
	funcFParamsList -> ',' funcFParam funcFParamsList | $;

14.	funcFParam -> bType Ident;
#函数参数funcFParam：类型bType（如 int、char）和标识符Ident（参数名）

#15.	block -> '{' (blockItem)* '}';
	block -> '{' blockItemList '}';
	blockItemList -> blockItem blockItemList | $;

16.	blockItem -> decl | stmt;
#blockItem：块中的语句stmt或声明decl，块中可以有多个语句或声明

#17.	stmt -> lVal '=' exp ';' | (exp)? ';' | block | 'if' '(' cond ')' stmt ('else' stmt)? | 'return' (exp)? ';';	
#现尝试将赋值语句合lVal '=' exp ';'并进expStmt中的exp中
#stmt -> lVal '=' exp ';' | expStmt | block | ifStmt | 'return' returnExpOpt ';';

#stmt -> expStmt | block | ifStmt | 'return' returnExpOpt ';';
	stmt -> expStmt | block | ifStmt | 'return' returnExpOpt ';';
	expStmt -> exp ';' | ';';
	ifStmt -> 'if' '(' exp ')' stmt elseStmtOpt;
#elseStmtOpt -> 'else' stmt | $;
	elseStmtOpt -> $;
#elseStmtOpt -> $;用elseStmtOpt来占位，用以在语法分析过程中陷入异常处理，从而实现手动识别else
	returnExpOpt -> exp | $;

#以上ifStmt的定义会导致Dangling Else二义性问题，无法满足LL(1)要求
#实际上LL(k)语法分析器没有办法处理Dangling Else问题
#注释掉ifStmt部分，使剩余部分可以满足LL(1)要求
#TODO：在语法分析器中，ifStmt部分将手动处理，并实现按照c标准，优先匹配最近的if策略
#ifStmt -> matchedIf | unmatchedIf;
#matchedIf -> 'if' '(' exp ')' matchedIf 'else' matchedIf | 'if' '(' exp ')' stmt 'else' stmt;
#unmatchedIf -> 'if' '(' exp ')' stmt | 'if' '(' exp ')' matchedIf;

#18.	exp -> addExp;
#exp -> addExp | assignExp;

	exp -> assignExp;
#assignExp -> lVal '=' assignExp | condExp
#lVal '=' assignExp和condExp有FIRST集冲突，此处无法满足LL(1)要求，尝试修改为以下形式
#assignExp -> lVal '=' assignExp | condExp | lVal postfixExpList mulExpList addExpList relExpList eqExpList lAndExpList lOrExpList;
#提取左公因子
	assignExp -> lVal lValSuffix | condExp;
	lValSuffix -> '=' assignExp | postfixExpList mulExpList addExpList relExpList eqExpList lAndExpList lOrExpList;


#19.	cond -> lOrExp;
#condExp说的其实是三目运算符的条件表达式，本次语法分析器不支持三目运算符
	condExp -> lOrExp;

20.	lVal -> Ident;

21.	primaryExp -> '(' exp ')' | number;

22.	number -> IntConst | floatConst;

#23.	unaryExp -> primaryExp | Ident '(' (funcRParams)? ')' | unaryOp unaryExp;
	unaryExp ->  postfixExp | unaryOp unaryExpExp;
	unaryExpExp -> lVal postfixExpList | unaryExp;
#postfixExp -> primaryExp | postfixExp '(' funcRParams ')' | postfixExp '(' ')';
	postfixExp -> primaryExp postfixExpList;
	postfixExpList -> '(' funcRParamsOpt ')' postfixExpList | $;
	funcRParamsOpt -> funcRParams | $;
#24.	unaryOp -> '+' | '-' | '!';
	unaryOp -> '+' | '-' | '!';

#25.	funcRParams -> funcRParam (',' funcRParam)*;
	funcRParams -> funcRParam funcRParamsList;
	funcRParamsList -> ',' funcRParam funcRParamsList | $;

26.	funcRParam -> exp;

#27.	mulExp -> unaryExp | mulExp ('*' | '/' | '%') unaryExp;
	mulExp -> unaryExp mulExpList;
	mulExpList -> mulexpOp mulExpExp mulExpList | $;
	mulExpExp -> lVal postfixExpList | unaryExp;
	mulexpOp -> '*' | '/' | '%';


#28.	addExp -> mulExp | addExp ('+' | '-') mulExp;
	addExp -> mulExp addExpList;
	addExpList -> addexpOp addExpExp addExpList | $;
	addExpExp -> lVal postfixExpList mulExpList | mulExp;
	addexpOp -> '+' | '-';

#29.	relExp -> addExp | relExp ('<' | '>' | '<=' | '>=') addExp;
	relExp -> addExp relExpList;
	relExpList -> relexpOp relExpExp relExpList | $;
	relExpExp -> lVal postfixExpList mulExpList addExpList | addExp;
	relexpOp -> '<' | '>' | '<=' | '>=';

#30.	eqExp -> relExp | eqExp ('==' | '!=') relExp;
	eqExp -> relExp eqExpList;
	eqExpList -> eqexpOp eqExpExp eqExpList | $;
	eqExpExp -> lVal postfixExpList mulExpList addExpList relExpList | relExp;
	eqexpOp -> '==' | '!=';

#31.	lAndExp -> eqExp | lAndExp '&&' eqExp;
	lAndExp -> eqExp lAndExpList;
	lAndExpList -> landexpOp lAndExpExp lAndExpList | $;
	lAndExpExp -> lVal postfixExpList mulExpList addExpList relExpList eqExpList | eqExp;
	landexpOp -> '&&';

#32.	lOrExp -> lAndExp | lOrExp '||' lAndExp;
	lOrExp -> lAndExp lOrExpList;
	lOrExpList -> lorexpOp lOrExpExp lOrExpList | $;
	lOrExpExp -> lVal postfixExpList mulExpList addExpList relExpList eqExpList lAndExpList | lAndExp;
	lorexpOp -> '||';

#33.	constExp -> addExp;
	constExp -> condExp

#34.	IntConst -> [0-9]+;
	IntConst -> 'INT'; 

#35.	Ident -> [a-zA-Z_][a-zA-Z_0-9]*;
	Ident -> 'IDN';

#36.	floatConst -> [0-9]+ '.' [0-9]+;
	floatConst -> 'FLOAT';
